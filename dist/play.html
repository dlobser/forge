<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forge</title>
  <style>
    :root{
      --eu-bg:#0d0f12; --eu-panel:#15181d; --eu-line:#262b33; --eu-text:#e6e8ea;
      --eu-muted:#8a929c; --eu-accent:#5b8cff;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; background:var(--eu-bg); color:var(--eu-text);
      font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
    #app{ height:100vh; width:100vw; }
    /* engine's WebGL canvas renders offscreen; we drawImage() it into previews */
    #glcanvas{ position:absolute; left:-10000px; top:0; width:512px; height:512px; }
    #boot{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      color:var(--eu-muted); font-size:13px; }
    [hidden]{ display:none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">loading…</div>
  <canvas id="glcanvas" width="512" height="512"></canvas>

  <script src="/js/forge-store.js"></script>
  <script src="/js/static-shim.js"></script>
  <script src="/web/graph/vendor/litegraph.js"></script>
  <script type="module" src="/web/graph/js/play.js"></script>
</body>
</html>
